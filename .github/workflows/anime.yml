# ──────────────────────────────────────────────────────────────
# Anime WhatsApp Notifier — GitHub Actions Workflow
# Runs every 3 hours (cloud-based), no local machine needed.
# ──────────────────────────────────────────────────────────────

name: Anime Episode Notifier

on:
  # ── Automatic: runs every 3 hours ──
  schedule:
    - cron: "0 */3 * * *"   # At minute 0 of every 3rd hour (UTC)

  # ── Manual: click "Run workflow" in GitHub Actions tab ──
  workflow_dispatch:

jobs:
  check-episodes:
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout the repository ──
      # Pulls the latest code including data.json for episode tracking
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Setup Python 3.10 ──
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── Step 3: Install dependencies ──
      # Installs all packages listed in requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 4: Run the anime tracker ──
      # Executes run_once.py which calls job() a single time and exits.
      # Twilio credentials are injected from GitHub Secrets.
      - name: Run anime episode checker
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          FROM_WHATSAPP_NUMBER: ${{ secrets.FROM_WHATSAPP_NUMBER }}
          TO_WHATSAPP_NUMBER: ${{ secrets.TO_WHATSAPP_NUMBER }}
        run: python run_once.py

      # ── Step 5: Persist data.json back to the repo ──
      # Commits the updated data.json so the next run knows which
      # episodes have already been notified (prevents duplicates).
      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # Only commit if data.json actually changed
          git diff --cached --quiet || git commit -m "chore: update episode tracking data [skip ci]"
          git push
